# SM8850 chip layer (Lenovo Legion Tab Y700, TB323FU).
#
# Read between power-profiles.conf and /etc/armada/power-profiles.conf, so only
# chip-specific fields live here. Thermal, fan and GPU values stay in the
# shared factory.
#
# The floor values are the real TB323FU firmware OPPs and form the initial
# compatibility tiers at roughly 60/80/90% of each policy's maximum. They are
# conservative caps, not vendor-recommended gaming frequencies.
#
# policy0 = six performance cores (0-5), policy6 = two prime cores (6-7).

[profile.eco]
cpu_governor=schedutil

[profile.balanced]
cpu_governor=schedutil

[profile.performance]
cpu_governor=performance

[underclock.SM8850.large]
cpu_max_policy0=2112000
cpu_max_policy6=2438400

[underclock.SM8850.medium]
cpu_max_policy0=2899200
cpu_max_policy6=3398400

[underclock.SM8850.small]
cpu_max_policy0=3187200
cpu_max_policy6=3859200
